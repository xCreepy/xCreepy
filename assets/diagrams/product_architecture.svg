<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="100%" height="100%">
  <defs>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3668F" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#F3668F" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A371F7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#A371F7" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F3668F" />
      <stop offset="100%" stop-color="#A371F7" />
    </linearGradient>
    <filter id="glowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="160" fill="#0D1117" />

  <!-- Connection Line -->
  <path d="M 120 80 L 780 80" stroke="url(#lineGrad)" stroke-width="2" stroke-dasharray="4,4" opacity="0.6" />
  
  <!-- Animated Data Packets (Simulated via SVG) -->
  <circle cx="230" cy="80" r="3" fill="#F3668F" filter="url(#glowPink)" />
  <circle cx="450" cy="80" r="3" fill="#F3668F" filter="url(#glowPink)" />
  <circle cx="670" cy="80" r="3" fill="#A371F7" />

  <!-- Nodes -->
  
  <!-- Discord -->
  <g transform="translate(40, 50)">
    <rect x="0" y="0" width="120" height="60" rx="8" fill="#0D1117" stroke="#F3668F" stroke-width="1.5" />
    <text x="60" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#F0F6FC" text-anchor="middle" letter-spacing="1">DISCORD</text>
    <text x="60" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#8B949E" text-anchor="middle">Client Interface</text>
  </g>

  <!-- Musiva -->
  <g transform="translate(260, 40)">
    <rect x="0" y="0" width="140" height="80" rx="8" fill="url(#pinkGrad)" stroke="#F3668F" stroke-width="2" filter="url(#glowPink)" />
    <text x="70" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#F3668F" text-anchor="middle" letter-spacing="1.5">MUSIVA</text>
    <text x="70" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#F0F6FC" text-anchor="middle">Core Platform</text>
  </g>

  <!-- Lavalink -->
  <g transform="translate(500, 50)">
    <rect x="0" y="0" width="120" height="60" rx="8" fill="#0D1117" stroke="#A371F7" stroke-width="1.5" />
    <text x="60" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#F0F6FC" text-anchor="middle" letter-spacing="1">LAVALINK</text>
    <text x="60" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#8B949E" text-anchor="middle">Audio Processing</text>
  </g>

  <!-- LavaMusiva -->
  <g transform="translate(720, 40)">
    <rect x="0" y="0" width="140" height="80" rx="8" fill="url(#purpleGrad)" stroke="#A371F7" stroke-width="2" />
    <text x="70" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#A371F7" text-anchor="middle" letter-spacing="1.5">LAVAMUSIVA</text>
    <text x="70" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#F0F6FC" text-anchor="middle">Managed Infra</text>
  </g>

  <!-- Labels -->
  <text x="210" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#F3668F" font-style="italic">Commands</text>
  <text x="440" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#F3668F" font-style="italic">Audio Stream</text>
  <text x="670" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#A371F7" font-style="italic">Node Routing</text>

</svg>
