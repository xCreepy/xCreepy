<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="100%" height="100%">
  <defs>
    <linearGradient id="gradPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F3668F" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#F3668F" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A371F7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#A371F7" stop-opacity="0.6" />
    </linearGradient>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F3668F" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A371F7" />
    </marker>
  </defs>

  <rect width="800" height="120" fill="#0D1117" />

  <!-- Paths -->
  <path d="M 90 60 L 140 60" stroke="#F3668F" stroke-width="2" marker-end="url(#arrowPink)" fill="none" opacity="0.8" />
  <path d="M 240 60 L 290 60" stroke="#F3668F" stroke-width="2" marker-end="url(#arrowPink)" fill="none" opacity="0.8" />
  <path d="M 390 60 L 440 60" stroke="#F3668F" stroke-width="2" marker-end="url(#arrowPink)" fill="none" opacity="0.8" />
  <path d="M 540 60 L 590 60" stroke="#A371F7" stroke-width="2" marker-end="url(#arrowPurple)" fill="none" opacity="0.8" />
  <path d="M 690 60 L 740 60" stroke="#A371F7" stroke-width="2" marker-end="url(#arrowPurple)" fill="none" opacity="0.8" />

  <!-- Nodes -->
  <!-- Discord -->
  <rect x="10" y="40" width="80" height="40" rx="4" fill="#0D1117" stroke="#F3668F" stroke-width="1.5" />
  <text x="50" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Discord</text>

  <!-- Musiva -->
  <rect x="150" y="35" width="90" height="50" rx="4" fill="url(#gradPink)" stroke="#F3668F" stroke-width="2" />
  <text x="195" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#F3668F" text-anchor="middle">Musiva</text>

  <!-- Audio -->
  <rect x="300" y="40" width="90" height="40" rx="4" fill="#0D1117" stroke="#F3668F" stroke-width="1.5" />
  <text x="345" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Audio</text>

  <!-- Lavalink -->
  <rect x="450" y="40" width="90" height="40" rx="4" fill="#0D1117" stroke="#A371F7" stroke-width="1.5" />
  <text x="495" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Lavalink</text>

  <!-- LavaMusiva -->
  <rect x="600" y="35" width="90" height="50" rx="4" fill="url(#gradPurple)" stroke="#A371F7" stroke-width="2" />
  <text x="645" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#A371F7" text-anchor="middle">LavaMusiva</text>

  <!-- Infra -->
  <rect x="750" y="40" width="40" height="40" rx="4" fill="#0D1117" stroke="#A371F7" stroke-width="1.5" />
  <text x="770" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#55FF55" text-anchor="middle">☁</text>

</svg>
