<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="100%" height="100%">
  <defs>
    <linearGradient id="cyanToPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#A371F7" />
      <stop offset="100%" stop-color="#55FF55" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1000" height="120" fill="#0D1117" />
  
  <g transform="translate(50, 40)">
    <!-- Nodes -->
    <rect x="0" y="0" width="100" height="40" rx="4" fill="#0D1117" stroke="#00F0FF" stroke-width="2" filter="url(#glow)"/>
    <text x="50" y="25" font-family="monospace" font-size="14" font-weight="bold" fill="#00F0FF" text-anchor="middle">IDEA</text>

    <line x1="100" y1="20" x2="150" y2="20" stroke="#A371F7" stroke-width="2" stroke-dasharray="4" />
    <polygon points="145,15 155,20 145,25" fill="#A371F7" />

    <rect x="150" y="0" width="100" height="40" rx="4" fill="#0D1117" stroke="#00F0FF" stroke-width="2" />
    <text x="200" y="25" font-family="monospace" font-size="14" font-weight="bold" fill="#00F0FF" text-anchor="middle">BUILD</text>

    <line x1="250" y1="20" x2="300" y2="20" stroke="#A371F7" stroke-width="2" stroke-dasharray="4" />
    <polygon points="295,15 305,20 295,25" fill="#A371F7" />

    <rect x="300" y="0" width="100" height="40" rx="4" fill="#0D1117" stroke="#00F0FF" stroke-width="2" />
    <text x="350" y="25" font-family="monospace" font-size="14" font-weight="bold" fill="#00F0FF" text-anchor="middle">TEST</text>

    <line x1="400" y1="20" x2="450" y2="20" stroke="#A371F7" stroke-width="2" stroke-dasharray="4" />
    <polygon points="445,15 455,20 445,25" fill="#A371F7" />

    <rect x="450" y="0" width="100" height="40" rx="4" fill="#0D1117" stroke="#A371F7" stroke-width="2" />
    <text x="500" y="25" font-family="monospace" font-size="14" font-weight="bold" fill="#A371F7" text-anchor="middle">BREAK</text>

    <line x1="550" y1="20" x2="600" y2="20" stroke="#A371F7" stroke-width="2" stroke-dasharray="4" />
    <polygon points="595,15 605,20 595,25" fill="#A371F7" />

    <rect x="600" y="0" width="100" height="40" rx="4" fill="#0D1117" stroke="#00F0FF" stroke-width="2" />
    <text x="650" y="25" font-family="monospace" font-size="14" font-weight="bold" fill="#00F0FF" text-anchor="middle">FIX</text>

    <line x1="700" y1="20" x2="750" y2="20" stroke="#A371F7" stroke-width="2" stroke-dasharray="4" />
    <polygon points="745,15 755,20 745,25" fill="#A371F7" />

    <rect x="750" y="0" width="100" height="40" rx="4" fill="#0D1117" stroke="#55FF55" stroke-width="2" filter="url(#glow)"/>
    <text x="800" y="25" font-family="monospace" font-size="14" font-weight="bold" fill="#55FF55" text-anchor="middle">DEPLOY</text>
  </g>
</svg>
