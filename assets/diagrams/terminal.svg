<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <rect width="800" height="200" rx="10" fill="#0D1117" stroke="#1a2332" stroke-width="2" />
  
  <!-- Window Controls -->
  <circle cx="30" cy="30" r="6" fill="#ff5f56" />
  <circle cx="50" cy="30" r="6" fill="#ffbd2e" />
  <circle cx="70" cy="30" r="6" fill="#27c93f" />
  
  <!-- Terminal Text -->
  <text x="30" y="75" font-family="monospace" font-size="16" fill="#A371F7">creepy@system <tspan fill="#ffffff">~</tspan> $ <tspan fill="#00F0FF">./status.sh</tspan></text>
  <text x="30" y="105" font-family="monospace" font-size="16" fill="#00F0FF">[INFRA] <tspan fill="#ffffff">Initializing systems...</tspan> <tspan fill="#55FF55">OK</tspan></text>
  <text x="30" y="130" font-family="monospace" font-size="16" fill="#00F0FF">[BUILD] <tspan fill="#ffffff">Compiling new features...</tspan> <tspan fill="#55FF55">OK</tspan></text>
  <text x="30" y="155" font-family="monospace" font-size="16" fill="#00F0FF">[DEPLOY] <tspan fill="#ffffff">Shipping to production...</tspan> <tspan fill="#55FF55">READY 🟢</tspan></text>
  <text x="360" y="155" font-family="monospace" font-size="16" fill="#00F0FF"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />_</text>
</svg>
