<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <linearGradient id="gradCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A371F7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#A371F7" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <rect width="800" height="200" fill="#0D1117" />

  <!-- Connecting Lines -->
  <path d="M 170 100 L 250 100" stroke="#A371F7" stroke-width="2" stroke-dasharray="4,4" fill="none" />
  <path d="M 390 100 L 470 100" stroke="#A371F7" stroke-width="2" stroke-dasharray="4,4" fill="none" />
  <path d="M 610 100 L 690 100" stroke="#A371F7" stroke-width="2" stroke-dasharray="4,4" fill="none" />

  <!-- Nodes -->
  <!-- Frontend -->
  <rect x="50" y="60" width="120" height="80" rx="6" fill="url(#gradCyan)" stroke="#00F0FF" stroke-width="1.5" />
  <text x="110" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">FRONTEND</text>
  <text x="110" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#A371F7" text-anchor="middle">React &middot; Next.js</text>

  <!-- Backend -->
  <rect x="270" y="60" width="120" height="80" rx="6" fill="url(#gradCyan)" stroke="#00F0FF" stroke-width="1.5" />
  <text x="330" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">BACKEND</text>
  <text x="330" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#A371F7" text-anchor="middle">Node &middot; Python</text>

  <!-- Database -->
  <rect x="490" y="60" width="120" height="80" rx="6" fill="url(#gradCyan)" stroke="#00F0FF" stroke-width="1.5" />
  <text x="550" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">DATABASE</text>
  <text x="550" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#A371F7" text-anchor="middle">PostgreSQL</text>

  <!-- Infrastructure -->
  <rect x="710" y="60" width="120" height="80" rx="6" fill="url(#gradPurple)" stroke="#A371F7" stroke-width="1.5" />
  <text x="770" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">DEPLOYMENT</text>
  <text x="770" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#00F0FF" text-anchor="middle">Docker &middot; Linux</text>

</svg>
