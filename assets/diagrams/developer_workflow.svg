<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="100%" height="100%">
  <rect width="900" height="120" fill="#0D1117" />
  
  <style>
    .node { fill: #161B22; stroke: #30363D; stroke-width: 1.5; rx: 20; }
    .node-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 600; fill: #F0F6FC; }
    .line { stroke: #30363D; stroke-width: 2; fill: none; stroke-dasharray: 4,4; }
    .active { stroke: #F3668F; }
    .complete { stroke: #55FF55; }
  </style>

  <g transform="translate(60, 40)">
    <path d="M 120 20 L 160 20" class="line active" />
    <path d="M 280 20 L 320 20" class="line active" />
    <path d="M 440 20 L 480 20" class="line active" />
    <path d="M 600 20 L 640 20" class="line complete" />

    <!-- Design -->
    <rect x="0" y="0" width="120" height="40" class="node active" />
    <text x="60" y="25" class="node-text" text-anchor="middle">DESIGN</text>

    <!-- Build -->
    <rect x="160" y="0" width="120" height="40" class="node active" />
    <text x="220" y="25" class="node-text" text-anchor="middle">BUILD</text>

    <!-- Test -->
    <rect x="320" y="0" width="120" height="40" class="node active" />
    <text x="380" y="25" class="node-text" text-anchor="middle">TEST</text>

    <!-- Deploy -->
    <rect x="480" y="0" width="120" height="40" class="node active" />
    <text x="540" y="25" class="node-text" text-anchor="middle">DEPLOY</text>

    <!-- Scale -->
    <rect x="640" y="0" width="120" height="40" class="node complete" />
    <text x="700" y="25" class="node-text" text-anchor="middle" fill="#55FF55">SCALE</text>
  </g>
</svg>
